name: Vehicle Insurance Assurance Suite

# Phase 3 of the Hi Tech Kane CLI loop
# (https://github.com/Themesto1994/hitech-agenticflow):
#   testmd run (author) → testrun run (sealed suite) → cover → evidence
#
# Designed *_test.md files have no recording yet. testrun preflight then
# exits 2 (missing_meta / invalid plan). Author each file first, same as
# hitech-agenticflow Phase 3, then bundle with testrun.
#
# Required secrets (Settings → Secrets and variables → Actions):
#   LT_USERNAME + LT_ACCESS_KEY
#   optional aliases: KANE_USERNAME / KANE_ACCESS_KEY / KANE_CLI_*

on:
  workflow_dispatch:
    inputs:
      max_tests_to_run:
        description: "Cap on tests to author (0 = all 18)"
        required: false
        default: "0"
        type: string
  push:
    branches: [main]
    paths:
      - ".testmuai/tests/**"
      - ".github/workflows/assurance.yml"
      - "kane-variables.seed.json"

env:
  KANE_CLI_VERSION: "@testmuai/kane-cli@0.8.12"
  VARIABLES_SEED: "kane-variables.seed.json"
  APP_URL: "https://sampleapp.tricentis.com/101/#"

jobs:
  assurance:
    name: "Author, replay, evidence"
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v1

      - name: Put Chrome on PATH
        run: |
          CHROME="${{ steps.chrome.outputs.chrome-path }}"
          echo "chrome-path=$CHROME"
          echo "$(dirname "$CHROME")" >> "$GITHUB_PATH"
          echo "KANE_CLI_CHROME_PATH=$CHROME" >> "$GITHUB_ENV"

      - name: Install kane-cli
        run: npm install -g ${{ env.KANE_CLI_VERSION }}

      - name: Authenticate kane-cli
        env:
          LT_USERNAME: ${{ secrets.LT_USERNAME || secrets.KANE_USERNAME || secrets.KANE_CLI_USERNAME }}
          LT_ACCESS_KEY: ${{ secrets.LT_ACCESS_KEY || secrets.KANE_ACCESS_KEY || secrets.KANE_CLI_ACCESS_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$LT_USERNAME" ] || [ -z "$LT_ACCESS_KEY" ]; then
            echo "::error::Set LT_USERNAME + LT_ACCESS_KEY (or KANE_USERNAME + KANE_ACCESS_KEY)."
            exit 1
          fi
          kane-cli login --username "$LT_USERNAME" --access-key "$LT_ACCESS_KEY"
          kane-cli config set-target desktop
          kane-cli config set-url "$APP_URL"
          kane-cli --version
          kane-cli whoami

      - name: Build run-time variables file
        run: |
          set -euo pipefail
          mkdir -p .testmuai/variables
          SEED="$VARIABLES_SEED"
          [ -f "$SEED" ] || SEED=/dev/null
          jq -n --slurpfile seed "$SEED" '($seed[0] // {})' > .testmuai/variables/runtime.json
          echo "Variables available to tests (values not shown):"
          jq -r 'to_entries[] | "  {{" + .key + "}}"' .testmuai/variables/runtime.json

      - name: Select tests
        id: select
        run: |
          set -euo pipefail
          mapfile -d '' -t all_tests < <(find .testmuai/tests -name '*_test.md' -print0 | sort -z)
          total=${#all_tests[@]}
          if [ "$total" -eq 0 ]; then
            echo "::warning::No *_test.md files under .testmuai/tests."
            echo "count=0" >> "$GITHUB_OUTPUT"
            : > selected_tests.txt
            exit 0
          fi
          max="${{ github.event.inputs.max_tests_to_run || '0' }}"
          if [ -n "$max" ] && [ "$max" -gt 0 ] && [ "$max" -lt "$total" ]; then
            selected=("${all_tests[@]:0:$max}")
          else
            selected=("${all_tests[@]}")
          fi
          printf '%s\0' "${selected[@]}" > selected_tests.txt
          echo "count=${#selected[@]}" >> "$GITHUB_OUTPUT"
          echo "Running ${#selected[@]} of $total tests:"
          printf '  %s\n' "${selected[@]}"

      # Same order as hitech-agenticflow Phase 3: author first so testrun
      # members are not missing_meta. --variables-file is valid on testmd.
      - name: "testmd run — Author each test"
        if: steps.select.outputs.count != '0'
        env:
          KANE_CLI_CHROME_PATH: ${{ env.KANE_CLI_CHROME_PATH }}
        run: |
          set +e
          failed=0
          : > authoring_links.tsv
          while IFS= read -r -d '' test_file; do
            echo "--- Authoring: $test_file"
            test_out=$(mktemp)
            kane-cli testmd run "$test_file" \
              --headless \
              --agent \
              --variables-file .testmuai/variables/runtime.json \
              | tee "$test_out"
            status=${PIPESTATUS[0]}
            if [ "$status" -ne 0 ]; then
              echo "::warning::Failed: $test_file (exit $status)"
              failed=$((failed + 1))
            fi
            share_url=$(grep -o '"share_url":"[^"]*"' "$test_out" | tail -n1 | sed -E 's/.*:"(.*)"/\1/' || true)
            testcase_id=$(grep -o '"testcase_id":"[^"]*"' "$test_out" | tail -n1 | sed -E 's/.*:"(.*)"/\1/' || true)
            printf '%s\t%s\t%s\n' "$test_file" "${testcase_id:-N/A}" "${share_url:-N/A}" >> authoring_links.tsv
            rm -f "$test_out"
          done < selected_tests.txt
          if [ "$failed" -gt 0 ]; then
            echo "::warning::$failed test(s) failed during authoring. Continuing to testrun."
          fi

      # testrun has no --variables-file. Do not re-pass --username here:
      # login already established the session (hitech-agenticflow does the same).
      - name: "testrun run — Bundle into one sealed suite"
        if: steps.select.outputs.count != '0'
        env:
          KANE_CLI_CHROME_PATH: ${{ env.KANE_CLI_CHROME_PATH }}
        run: |
          set +e
          set -uo pipefail
          mapfile -d '' -t TESTS < selected_tests.txt

          echo "== dry-run plan =="
          kane-cli testrun run "${TESTS[@]}" --dry-run --headless --on-failure continue \
            2>&1 | tee testrun-dry-run.log
          dry_code=${PIPESTATUS[0]}
          if [ "$dry_code" -eq 2 ]; then
            echo "::error::testrun plan is invalid (exit 2). Designed tests must be authored first; see dry-run log."
            exit 2
          fi

          kane-cli testrun run "${TESTS[@]}" \
            --headless \
            --on-failure continue \
            --name "insurance-ci-${{ github.run_number }}" \
            2>&1 | tee testrun.log
          code=${PIPESTATUS[0]}

          done_line=$(grep -E '"type": *"testrun_done"' testrun.log | tail -n 1 || true)
          if [ -z "$done_line" ]; then
            echo "::error::kane-cli testrun did not complete (exit $code)."
            [ "$code" -eq 0 ] && code=1
            exit "$code"
          fi
          status=$(jq -r '.overall_status // "unknown"' <<< "$done_line" 2>/dev/null || echo unknown)
          if [ "$status" != "passed" ]; then
            echo "::warning::Suite overall status '$status'. Failed tests stay in evidence; the job does not fail on them."
          fi

      - name: Generate coverage / assurance report
        if: always()
        run: |
          {
            echo "## Coverage — proof pack"
            kane-cli cover || true
            echo
            echo "## Coverage — designed x proven, per use case"
            kane-cli cover gaps || true
          } | tee assurance-coverage-report.txt

      - name: Upload evidence packs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-packs-${{ github.run_number }}
          path: |
            .testmuai/evidence/*.evidence
            testrun.log
            testrun-dry-run.log
            authoring_links.tsv
          if-no-files-found: warn
          retention-days: 30

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-${{ github.run_number }}
          path: assurance-coverage-report.txt
          if-no-files-found: warn
          retention-days: 90
