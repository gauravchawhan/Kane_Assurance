name: Vehicle Insurance Assurance Suite

# Runs already-designed *_test.md files under .testmuai/tests (the path used
# by CLI-Assurance-BFSI and kaneCLIassurance). This does NOT ingest or design
# — use kane-cli-assurance.yml for the full lifecycle.
#
# Required repo secrets:
#   LT_USERNAME / LT_ACCESS_KEY   or   KANE_CLI_USERNAME / KANE_CLI_ACCESS_KEY

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - ".testmuai/tests/**"
      - ".github/workflows/assurance.yml"
      - "kane-variables.seed.json"

env:
  KANE_CLI_VERSION: "@testmuai/kane-cli"
  VARIABLES_SEED: "kane-variables.seed.json"

jobs:
  assurance:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v1

      - name: Install kane-cli
        run: npm install -g ${{ env.KANE_CLI_VERSION }}

      - name: Authenticate kane-cli
        env:
          LT_USERNAME: ${{ secrets.LT_USERNAME || secrets.KANE_CLI_USERNAME }}
          LT_ACCESS_KEY: ${{ secrets.LT_ACCESS_KEY || secrets.KANE_CLI_ACCESS_KEY }}
        run: |
          if [ -z "$LT_USERNAME" ] || [ -z "$LT_ACCESS_KEY" ]; then
            echo "::error::Set LT_USERNAME + LT_ACCESS_KEY (or KANE_CLI_USERNAME + KANE_CLI_ACCESS_KEY)."
            exit 1
          fi
          kane-cli login --username "$LT_USERNAME" --access-key "$LT_ACCESS_KEY"
          kane-cli config set-target desktop
          kane-cli config set-url https://sampleapp.tricentis.com/101/#
          kane-cli --version
          kane-cli whoami

      - name: Build run-time variables file
        run: |
          set -euo pipefail
          mkdir -p .testmuai/variables
          SEED="$VARIABLES_SEED"
          [ -f "$SEED" ] || SEED=/dev/null
          jq -n --slurpfile seed "$SEED" '($seed[0] // {})' > .testmuai/variables/runtime.json
          echo "Variables available to tests (values not shown):"
          jq -r 'to_entries[] | "  {{" + .key + "}}"' .testmuai/variables/runtime.json

      # Bare `kane-cli testrun run` walks the cwd and skips dot-directories, so
      # it never sees .testmuai/tests — that is an empty/invalid plan (exit 2)
      # in under a second. Pass the files explicitly. Credentials also go on
      # testrun itself (CI docs: do not rely on a prior `login` session).
      # Failed tests are results, not pipeline errors: stay green on exit 1
      # when testrun_done arrived. Exit 2 (nothing ran) still fails the job.
      - name: Run the assurance test suite
        id: testrun
        env:
          LT_USERNAME: ${{ secrets.LT_USERNAME || secrets.KANE_CLI_USERNAME }}
          LT_ACCESS_KEY: ${{ secrets.LT_ACCESS_KEY || secrets.KANE_CLI_ACCESS_KEY }}
          KANE_CLI_CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          set +e
          set -uo pipefail
          mapfile -t TESTS < <(find .testmuai/tests -name '*_test.md' | sort)
          if [ "${#TESTS[@]}" -eq 0 ]; then
            echo "::warning::No *_test.md files under .testmuai/tests. Run the lifecycle workflow first, or design tests locally."
            exit 0
          fi
          echo "Running ${#TESTS[@]} test(s):"
          printf '  %s\n' "${TESTS[@]}"

          kane-cli testrun run "${TESTS[@]}" \
            --headless \
            --parallel 1 \
            --on-failure continue \
            --username "$LT_USERNAME" \
            --access-key "$LT_ACCESS_KEY" \
            --variables-file .testmuai/variables/runtime.json \
            --name "CI run #${{ github.run_number }} (${{ github.sha }})" \
            2>&1 | tee testrun.log
          code=${PIPESTATUS[0]}

          done_line=$(grep -E '"type": *"testrun_done"' testrun.log | tail -n 1 || true)
          if [ -z "$done_line" ]; then
            echo "::error::kane-cli testrun did not complete (exit $code). This is a pipeline or setup problem, not a test failure; see the log above."
            [ "$code" -eq 0 ] && code=1
            exit "$code"
          fi

          status=$(jq -r '.overall_status // "unknown"' <<< "$done_line" 2>/dev/null || echo unknown)
          if [ "$status" != "passed" ]; then
            echo "::warning::Suite overall status '$status'. Failed tests are recorded in evidence; the pipeline does not fail on them."
          fi

      - name: Generate coverage / assurance report
        if: always()
        run: |
          {
            echo "## Coverage — proof pack"
            kane-cli cover || true
            echo
            echo "## Coverage — designed x proven, per use case"
            kane-cli cover gaps || true
          } | tee assurance-coverage-report.txt

      - name: Upload evidence packs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-packs-${{ github.run_number }}
          path: |
            .testmuai/evidence/*.evidence
            testrun.log
          if-no-files-found: warn
          retention-days: 30

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-${{ github.run_number }}
          path: assurance-coverage-report.txt
          if-no-files-found: warn
          retention-days: 90
